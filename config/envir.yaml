# ============================================================================
# L-Splat / Anamorphic-3DGS 统一 Conda 环境定义
# ============================================================================
# 覆盖依赖: Depth Anything V3 | 3D Gaussian Splatting | OpenCV C++ JBF |
#            Asymmetric Dual-Frustum CUDA Rasterization
# ============================================================================
#
# 一键创建环境:
#   conda env create -f envir.yaml
#
# 激活环境:
#   conda activate anamorphic-3dgs
#
# 安装 3DGS CUDA 子模块 (在环境激活后执行):
#   pip install -e gaussian-splatting-main/submodules/diff-gaussian-rasterization
#   pip install -e gaussian-splatting-main/submodules/simple-knn
#
# 安装 Depth Anything V3 本地源码 (在环境激活后执行):
#   pip install -e Depth-Anything-3-main/
# ============================================================================

name: anamorphic-3dgs

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ── Python 运行时 ──
  - python=3.10

  # ── PyTorch 全家桶 (CUDA 12.1) ──
  - pytorch>=2.1
  - torchvision>=0.16
  - torchaudio>=2.1
  - pytorch-cuda=12.1

  # ── 科学计算基础 ──
  - numpy<2            # DAV3 要求 numpy<2
  - scipy>=1.10
  - matplotlib-base>=3.7

  # ── 图像 I/O 与工具 ──
  - pillow>=10.0
  - tqdm>=4.65
  - joblib>=1.3

  # ── pip 依赖 (conda 无法/不便安装的包) ──
  - pip>=23.0
  - pip:
      # --- DAV3 核心依赖 ---
      - transformers>=4.40
      - huggingface-hub>=0.20
      - omegaconf>=2.3
      - einops>=0.7
      - addict>=2.4
      - safetensors>=0.4
      - typer>=0.9

      # --- DAV3 可选/streaming 依赖 ---
      - moviepy>=1.0

      # --- 3DGS 数据格式 ---
      - plyfile>=1.0

      # --- OpenCV (ximgproc 模块提供 C++ JBF) ---
      - opencv-contrib-python>=4.8

# ============================================================================
# 手动安装项目组件 (pip install -e, 无 conda 包):
# ============================================================================
#   1. DAV3:
#      pip install -e Depth-Anything-3-main/
#
#   2. 修改版 3DGS CUDA 光栅化器:
#      pip install -e gaussian-splatting-main/submodules/diff-gaussian-rasterization
#      pip install -e gaussian-splatting-main/submodules/simple-knn
#
#   3. gsplat (可选, DAV3 3DGS 渲染):
#      pip install git+https://github.com/nerfstudio-project/gsplat.git
#
#   4. DIS/RAFT 光流 (可选, 未来时序一致性):
#      待后续集成时补充
# ============================================================================
